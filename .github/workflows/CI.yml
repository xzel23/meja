name: CI
on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # Setup JDK 21 for build
      - name: 'Set up JDK 21'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # Extract Gradle version from wrapper properties for cache key
      - name: 'Extract Gradle Version'
        id: gradle-version
        run: |
          GRADLE_VERSION=$(sed -n -e 's!.*gradle-!!' -e 's!-bin.zip!!p' < gradle/wrapper/gradle-wrapper.properties)
          echo "Detected Gradle version: $GRADLE_VERSION"
          echo "gradle_version=$GRADLE_VERSION" >> "$GITHUB_OUTPUT"
          # Create a file with the Gradle version for other jobs to use
          mkdir -p build/gradle-version
          echo "$GRADLE_VERSION" > build/gradle-version/version.txt

      - name: 'Setup Gradle'
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: ${{ steps.gradle-version.outputs.gradle_version }}
          gradle-home-cache-includes: |
            caches
            notifications
            jdks
            wrapper
            toolchains

      - name: Detect prepared release
        id: prepared-release
        run: |
          if [[ -f gradle/prepared-release.toml ]]; then
            echo "prepared=true" >> "$GITHUB_OUTPUT"
          else
            echo "prepared=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 'Execute Gradle build'
        run: gradle --no-daemon --build-cache assemble testClasses
        id: compile

      - name: Prepare tested release bundle
        if: github.event_name == 'push' && github.ref_protected && steps.prepared-release.outputs.prepared == 'true'
        run: gradle --no-daemon --build-cache --no-configuration-cache -PciReleaseBundle=true prepareCiReleaseBundle

      # Upload build artifacts for other jobs to use
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-artifacts
          path: |
            **/build/libs/*.jar
            **/build/classes/
            **/build/classes-cabe/
            build/gradle-version/version.txt
          if-no-files-found: error

      - name: Upload tested release bundle
        if: github.event_name == 'push' && github.ref_protected && steps.prepared-release.outputs.prepared == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-bundle
          path: |
            build/staging-deploy
            build/release-bundle/manifest.sha256
            build/release-bundle/metadata.properties
          if-no-files-found: error

  test-linux:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # Setup JDK 25 + JavaFX
      - name: 'Set up JDK 25 with JavaFX'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'liberica'
          java-version: '25'
          java-package: 'jdk+fx'
          cache: 'gradle'

      # Download build artifacts first to get the Gradle version file
      - name: Download build artifacts
        uses: actions/download-artifact@8.0.1
        with:
          name: build-artifacts
          path: ${{ github.workspace }}

      # Read Gradle version from the file created in the build job
      - name: 'Read Gradle Version'
        id: gradle-version
        run: |
          GRADLE_VERSION=$(cat build/gradle-version/version.txt)
          echo "Detected Gradle version: $GRADLE_VERSION"
          echo "gradle_version=$GRADLE_VERSION" >> "$GITHUB_OUTPUT"

      - name: 'Setup Gradle'
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: ${{ steps.gradle-version.outputs.gradle_version }}
          gradle-home-cache-includes: |
            caches
            notifications
            jdks
            wrapper
            toolchains

      - name: Start xvfb
        run: Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &

      - name: Run tests
        run: gradle --no-daemon --build-cache test testCodeCoverageReport
        env:
          DISPLAY: ":99"

      # Upload coverage reports
      - name: Upload coverage reports
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-reports
          path: |
            **/build/reports/jacoco/test/jacocoTestReport.xml
            **/build/reports/jacoco/testCodeCoverageReport/testCodeCoverageReport.xml
          if-no-files-found: warn

  test-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # Setup JDK 25 with JavaFX
      - name: 'Set up JDK 25 with JavaFX'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'liberica'
          java-version: '25'
          java-package: 'jdk+fx'
          cache: 'gradle'

      # Download build artifacts first to get the Gradle version file
      - name: Download build artifacts
        uses: actions/download-artifact@8.0.1
        with:
          name: build-artifacts
          path: ${{ github.workspace }}

      # Read Gradle version from the file created in the build job
      - name: 'Read Gradle Version'
        id: gradle-version
        shell: bash
        run: |
          GRADLE_VERSION=$(cat build/gradle-version/version.txt)
          echo "Detected Gradle version: $GRADLE_VERSION"
          echo "gradle_version=$GRADLE_VERSION" >> "$GITHUB_OUTPUT"

      - name: 'Setup Gradle'
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: ${{ steps.gradle-version.outputs.gradle_version }}
          gradle-home-cache-includes: |
            caches
            notifications
            jdks
            wrapper
            toolchains

      - name: Run tests
        run: gradle --no-daemon --build-cache test

  sonar:
    needs: test-linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # Setup JDK 25 with JavaFX
      - name: 'Set up JDK 25 with JavaFX'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'liberica'
          java-version: '25'
          java-package: 'jdk+fx'
          cache: 'gradle'

      # Download build artifacts first to get the Gradle version file
      - name: Download build artifacts
        uses: actions/download-artifact@8.0.1
        with:
          name: build-artifacts
          path: ${{ github.workspace }}

      # Read Gradle version from the file created in the build job
      - name: 'Read Gradle Version'
        id: gradle-version
        run: |
          GRADLE_VERSION=$(cat build/gradle-version/version.txt)
          echo "Detected Gradle version: $GRADLE_VERSION"
          echo "gradle_version=$GRADLE_VERSION" >> "$GITHUB_OUTPUT"

      - name: 'Setup Gradle'
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: ${{ steps.gradle-version.outputs.gradle_version }}
          gradle-home-cache-includes: |
            caches
            notifications
            jdks
            wrapper
            toolchains

      # Download coverage reports
      - name: Download coverage reports
        uses: actions/download-artifact@8.0.1
        with:
          name: coverage-reports
          path: ${{ github.workspace }}

      - name: 'Cache SonarCloud packages'
        uses: actions/cache@v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: 'Sonar Scan'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          gradle --no-daemon --no-build-cache --no-configuration-cache --no-parallel sonar
          -Dsonar.projectKey=xzel23_meja
          -Dsonar.organization=xzel23
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.coverage.jacoco.xmlReportPaths=**/build/reports/jacoco/**/*.xml

  qodana:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # Setup JDK 25 with JavaFX
      - name: 'Set up JDK 25 with JavaFX'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'liberica'
          java-version: '25'
          java-package: 'jdk+fx'
          cache: 'gradle'

      # Download build artifacts first to get the Gradle version file
      - name: Download build artifacts
        uses: actions/download-artifact@8.0.1
        with:
          name: build-artifacts
          path: ${{ github.workspace }}

      # Read Gradle version from the file created in the build job
      - name: 'Read Gradle Version'
        id: gradle-version
        run: |
          GRADLE_VERSION=$(cat build/gradle-version/version.txt)
          echo "Detected Gradle version: $GRADLE_VERSION"
          echo "gradle_version=$GRADLE_VERSION" >> "$GITHUB_OUTPUT"

      - name: 'Setup Gradle'
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: ${{ steps.gradle-version.outputs.gradle_version }}
          gradle-home-cache-includes: |
            caches
            notifications
            jdks
            wrapper
            toolchains

      - name: 'Create Qodana config'
        run: |
          cat > qodana.yaml << 'EOF'
          version: "1.0"
          profile:
            name: qodana.starter
          exclude:
            - name: All
              paths:
                - "**/jmh/**"
          EOF

      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2026.2.0
        with:
          args: --property,idea.kotlin.plugin.use.k2=false
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
